<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24245a">
<title>Brújula Fénix Aventura</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg">
<style>
  :root { --bg:#24245a; --card:#33337a; --txt:#f8f19c; --mut:#c9c3e8; --acc:#f07a1a; --red:#d9534f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; text-align:center; }
  main { padding:16px 12px 24px; max-width:480px; margin:auto; }
  .dial { position:relative; width:min(94vw,440px); aspect-ratio:1; margin:8px auto; }
  .dial svg { width:100%; height:100%; }
  #rosa { transition:transform .15s linear; transform-origin:100px 100px; }
  .pointer { position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:10px solid transparent; border-right:10px solid transparent; border-top:18px solid var(--acc); }
  .heading { font-size:2.2rem; font-weight:700; margin:0; }
  .card { background:var(--card); border-radius:12px; padding:8px 12px; margin-top:10px; }
  .row { display:flex; justify-content:space-between; padding:4px 0; }
  .row span:first-child { color:var(--mut); }
  button { background:var(--acc); color:#24245a; border:0; border-radius:8px; padding:7px 12px; font-size:.85rem; font-weight:600; margin:4px 2px; }
  .botones { display:flex; justify-content:center; flex-wrap:wrap; gap:4px; }
  .datos { display:flex; justify-content:space-around; }
  .datos div span { display:block; }
  .datos { gap:4px; font-size:.85rem; }
  .datos > div { flex:1; min-width:0; }
  .datos .et { color:var(--mut); font-size:.68rem; }
  .profe { font-size:.85rem; margin-top:10px; }
  .profe a { color:var(--txt); font-weight:600; text-decoration:none; }
  button.sec { background:transparent; color:var(--txt); border:1px solid var(--mut); }
  .arrow { width:60px; height:60px; margin:4px auto; transition:transform .15s linear; }
  .dist { font-size:1.4rem; font-weight:700; }
  .msg { color:var(--mut); font-size:.75rem; margin-top:6px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="botones"><button id="start">Activar brújula y GPS</button></div>

  <div class="dial">
    <div class="pointer"></div>
    <svg viewBox="0 0 200 200">
      <!-- logo fijo de fondo -->
      <image href="logo.svg" x="20" y="20" width="160" height="160"/>
      <g id="rosa">
        <!-- anillo oscuro para que las letras contrasten -->
        <circle cx="100" cy="100" r="89" fill="none" stroke="#24245a" stroke-width="20"/>
        <circle cx="100" cy="100" r="99" fill="none" stroke="#c9c3e8" stroke-width="1.5"/>
        <g id="ticks"></g>
        <g font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">
          <text x="100" y="11" fill="#ff5a4a">N</text>
          <text x="189" y="100" fill="#f8f19c">E</text>
          <text x="100" y="189" fill="#f8f19c">S</text>
          <text x="11" y="100" fill="#f8f19c">O</text>
        </g>
        <g stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
          <polygon points="100,40 109,100 91,100" fill="#d62828"/>
          <polygon points="100,160 109,100 91,100" fill="#24245a"/>
        </g>
        <circle cx="100" cy="100" r="5" fill="#ffffff" stroke="#24245a" stroke-width="2"/>
      </g>
    </svg>
  </div>
  <p class="heading"><span id="grados">--</span>° <span id="punto"></span></p>
  <p class="msg" id="msgBrujula"></p>

  <div class="card datos">
    <div><span class="et">Latitud</span><span id="lat">--</span></div>
    <div><span class="et">Longitud</span><span id="lon">--</span></div>
    <div><span class="et">Altitud</span><span id="alt">--</span></div>
    <div><span class="et">Precisión</span><span id="prec">--</span></div>
  </div>

  <div class="card">
    <div id="volver" class="hidden">
      <div class="msg">Dirección al punto guardado</div>
      <svg class="arrow" id="flecha" viewBox="0 0 100 100"><polygon points="50,5 80,90 50,70 20,90" fill="#f07a1a"/></svg>
      <div class="dist" id="dist">--</div>
      <div class="msg" id="guardadoInfo"></div>
    </div>
    <div class="botones">
      <button id="guardar">Guardar punto</button>
      <button id="borrar" class="sec hidden">Borrar punto</button>
    </div>
  </div>
  <p class="profe">Profe Gabriel Orozco · <a href="tel:+542984506202">📞 298-450-6202</a></p>
  <p class="msg">Funciona sin internet. Para más precisión, aleja el celular de objetos metálicos y muévelo haciendo un "8".</p>
</main>

<script>
const $ = id => document.getElementById(id);
const PUNTOS = ['N','NE','E','SE','S','SO','O','NO'];
let heading = null, pos = null;
let destino = null;
try { destino = JSON.parse(localStorage.getItem('destino')); } catch(e) {}

// marcas de la rosa
const ticks = $('ticks');
for (let i = 0; i < 360; i += 10) {
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  if (i % 90 === 0) continue;
  const largo = i % 30 === 0 ? 7 : 4;
  l.setAttribute('x1',100); l.setAttribute('y1',1); l.setAttribute('x2',100); l.setAttribute('y2',1+largo);
  l.setAttribute('stroke','#c9c3e8'); l.setAttribute('stroke-width',2);
  l.setAttribute('transform',`rotate(${i} 100 100)`);
  ticks.appendChild(l);
}

const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function distancia(a, b) {
  const R = 6371000, dLat = rad(b.lat-a.lat), dLon = rad(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function rumbo(a, b) {
  const y = Math.sin(rad(b.lon-a.lon)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat))*Math.sin(rad(b.lat)) - Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}

function render() {
  if (heading !== null) {
    $('rosa').style.transform = `rotate(${-heading}deg)`;
    $('grados').textContent = Math.round(heading);
    $('punto').textContent = PUNTOS[Math.round(heading / 45) % 8];
  }
  $('volver').classList.toggle('hidden', !destino);
  $('borrar').classList.toggle('hidden', !destino);
  if (destino) {
    $('guardadoInfo').textContent = 'Guardado ' + new Date(destino.t).toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    if (pos) {
      const d = distancia(pos, destino);
      $('dist').textContent = d < 1000 ? `${Math.round(d)} m` : `${(d/1000).toFixed(2)} km`;
      const r = rumbo(pos, destino);
      $('flecha').style.transform = `rotate(${r - (heading ?? 0)}deg)`;
    }
  }
}

function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;        // iPhone
  else if (e.absolute && e.alpha !== null) h = 360 - e.alpha;                         // Android
  if (h === null) return;
  const ang = (screen.orientation && screen.orientation.angle) || 0;
  heading = (h + ang + 360) % 360;
  $('msgBrujula').textContent = '';
  render();
}

async function iniciar() {
  $('start').parentElement.classList.add('hidden');
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch(e) {}
  if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOrient);
  else window.addEventListener('deviceorientation', onOrient);
  setTimeout(() => { if (heading === null) $('msgBrujula').textContent = 'Este celular no entrega datos de brújula.'; }, 3000);

  if (!navigator.geolocation) { $('alt').textContent = 'Sin GPS'; return; }
  navigator.geolocation.watchPosition(p => {
    pos = { lat: p.coords.latitude, lon: p.coords.longitude };
    $('lat').textContent = pos.lat.toFixed(5);
    $('lon').textContent = pos.lon.toFixed(5);
    $('alt').textContent = p.coords.altitude != null ? `${Math.round(p.coords.altitude)} m` : 'no disponible';
    $('prec').textContent = `± ${Math.round(p.coords.accuracy)} m`;
    render();
  }, err => {
    $('alt').textContent = err.code === 1 ? 'Permiso denegado' : 'Buscando señal…';
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
}

$('start').onclick = iniciar;
$('guardar').onclick = () => {
  if (!pos) { alert('Espera a que el GPS encuentre tu ubicación.'); return; }
  if (destino && !confirm('¿Reemplazar el punto guardado?')) return;
  destino = { ...pos, t: Date.now() };
  try { localStorage.setItem('destino', JSON.stringify(destino)); } catch(e) {}
  render();
};
$('borrar').onclick = () => {
  if (!confirm('¿Borrar el punto guardado?')) return;
  destino = null;
  try { localStorage.removeItem('destino'); } catch(e) {}
  render();
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
